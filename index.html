<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Looni</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">Tap a ring to place a note. Tap it again to remove it.</div>
  <div id="controls">
    <label>Speed <input id="tempo" type="range" min="4" max="20" step="0.5" value="7.5"></label>
    <label>Scale <select id="scale"></select></label>
    <button id="clear" type="button">Clear</button>
  </div>
  <!-- plain scripts (not modules) so index.html works by double-clicking it -->
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
